name: Build and Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv and project dependencies
        run: |
          pip install uv
          cd src/server
          uv venv
          uv pip install -r pyproject.toml

      - name: Import Certificate
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign

      - name: Create Keychain Profile for Notarytool
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: Build macOS app with PyInstaller
        run: |
          cd src/server
          source .venv/bin/activate
          pyinstaller app.spec

      - name: Sign the App
        run: |
          cd src/server
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Aleksandr Alekseev ($TEAM_ID)" \
            --options runtime \
            --entitlements macos/entitlements.plist \
            dist/AudioSummarizer.app

      - name: Archive .app into .zip
        run: |
          cd src/server/dist
          ditto -c -k --sequesterRsrc --keepParent AudioSummarizer.app AudioSummarizer.zip

      - name: Notarize the App
        run: |
          cd src/server/dist
          xcrun notarytool submit AudioSummarizer.zip --keychain-profile "AC_PASSWORD" --wait

      - name: Staple Notarization
        run: |
          cd src/server/dist
          xcrun stapler staple AudioSummarizer.app

      - name: Clean up secrets
        if: always()
        run: |
          rm -f cert.p12

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: src/server/dist/AudioSummarizer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
